# 보안등급 제안 룰팩 — 계약 v1.0 대응
#
# 원본: 정보자산관리지침 [별지 제3호] 정보자산 중요도 평가 기준
#       statement 는 별지 원문을 그대로 옮기고, 어떤 값으로 확인했는지만 괄호로 덧붙인다.
#
# 별지 제3호에서 기계로 확인되는 조건은 셋뿐이다.
#   기밀성  접근 범위 3단계
#   무결성  "실시간 백업이 없어 복구하기 힘든 경우"
#   가용성  "대체(백업) 자산이 없어 장기적인 업무 중단"
# 나머지("중대한 금전적 손실", "1시간 이내 복구")는 사람만 판단한다.
#
# 계약 v1.0에서 못 쓰게 된 것 — 기밀성 접근 범위 3단계.
#   수집기 필드 37종에 정보 민감도가 없다. 개인정보 보유 여부(has_personal_info)만 있어
#   기밀성 '상'은 낼 수 있지만 '중'과 '하'를 가를 근거가 없다.
#   DataClass 태그 수집을 요청해 둔 상태이며, 들어오면 접근 범위 룰을 되살린다.
#
# 원본 문서의 결함 — 별지 제3호의 무결성 '상'과 '중'이 같은 문장이다. 중 조건을
# 그대로 옮기면 모든 자산이 상이면서 중이 되므로 상만 쓴다. 지침 개정 권고 항목.
#
# basis_type
#   asset_attribute  자산 자체의 속성. 등급을 확정할 수 있는 유일한 근거
#   control_state    통제 상태. 별지가 '상' 조건에 명시한 경우만, 올리는 쪽으로만
#
# when: 모든 조건이 맞아야 발화(AND). 값이 리스트면 그중 하나면 됨.
#       문자열은 대소문자를 무시하고 비교한다. 수집기가 태그 원문을 그대로 싣기 때문에
#       Prod / prod 가 섞여 들어온다.

ruleset_version: "1.0.0"

rules:
  # ── 기밀성 ────────────────────────────────────────────────────────
  - id: C-PII-01
    axis: confidentiality
    level: 상
    basis_type: asset_attribute
    when: { has_personal_info: true }
    statement: 개인정보를 보유하여 유출 시 개인정보 보호법상 책임이 발생하는 자산 (PII 태그)
    source: ISMS-P 인증기준 1.2.1 ② 법적 요구사항 고려
    evidence_field: has_personal_info

  - id: C-PII-02
    axis: confidentiality
    level: 하
    basis_type: asset_attribute
    when: { has_personal_info: false }
    statement: 개인정보를 담고 있지 않아 유출되어도 법적 책임이 발생하지 않는 자산 (PII 태그)
    source: 정보자산관리지침 별지 제3호 기밀성 하
    evidence_field: has_personal_info

  # ── 무결성 ────────────────────────────────────────────────────────
  - id: I-PII-01
    axis: integrity
    level: 상
    basis_type: asset_attribute
    when: { has_personal_info: true }
    statement: 개인정보를 보유하여 변조 시 정보주체의 권리가 직접 침해되는 자산 (PII 태그)
    source: ISMS-P 인증기준 1.2.1 ② 법적 요구사항 고려
    evidence_field: has_personal_info

  - id: I-PROD-01
    axis: integrity
    level: 중
    basis_type: asset_attribute
    when: { environment: prod }
    statement: 자산 변조 시 업무수행 또는 서비스에 장애를 유발할 수 있는 운영 환경 자산 (Environment 태그)
    source: 정보자산관리지침 별지 제3호 무결성 상·중 (운영 환경 여부로 근사)
    evidence_field: environment

  - id: I-NONPROD-01
    axis: integrity
    level: 하
    basis_type: asset_attribute
    when: { environment: [dev, test, stg] }
    statement: 자산이 변조되어도 업무수행에 미치는 영향이 미흡한 개발·시험 환경 자산 (Environment 태그)
    source: 정보자산관리지침 별지 제3호 무결성 하
    evidence_field: environment

  - id: I-IMAGE-01
    axis: integrity
    level: 상
    basis_type: asset_attribute
    when:
      asset_type: 가상자원
      environment: prod
    statement: 운영에 배포되는 가상자원으로, 변조 시 운영 환경 전체에 악성 코드가 퍼져 무결성 검증이 어려움
    source: 정보자산관리지침 별지 제3호 무결성 상 / CSAP 3.1.1 가상자원 식별
    evidence_field: environment

  - id: I-BACKUP-01
    axis: integrity
    level: 상
    basis_type: control_state
    when: { infra_facts.backup_exists: false }
    statement: 해당 자산정보에 대한 실시간 백업이 이루어지고 있지 않아 원래의 정보를 복구하기 힘든 경우
    source: 정보자산관리지침 별지 제3호 무결성 상
    evidence_field: infra_facts.backup_exists

  # ── 가용성 ────────────────────────────────────────────────────────
  - id: A-PROD-01
    axis: availability
    level: 중
    basis_type: asset_attribute
    when: { environment: prod }
    statement: 장애 시 서비스 제공에 직접 영향을 주는 운영 환경 자산 (Environment 태그)
    source: 정보자산관리지침 별지 제3호 가용성 중 (운영 환경 여부로 근사)
    evidence_field: environment

  - id: A-NONPROD-01
    axis: availability
    level: 하
    basis_type: asset_attribute
    when: { environment: [dev, test, stg] }
    statement: 사용 불가능해도 대외 서비스 중단이나 성능 저하에 직접적인 영향을 미치지 않는 자산 (Environment 태그)
    source: 정보자산관리지침 별지 제3호 가용성 하
    evidence_field: environment

  # 대체 자산 부재는 자산유형마다 확인하는 값이 다르다. 하나로 합친 필드가 없어 둘로 나눈다.
  - id: A-REDUN-01
    axis: availability
    level: 상
    basis_type: control_state
    when:
      asset_type: 서버
      infra_facts.in_asg: false
    statement: 해당 자산이 사용 불가능할 때 대체(백업) 자산이 없어 장기적인 업무 중단이 발생하는 경우 (Auto Scaling 그룹 미소속)
    source: 정보자산관리지침 별지 제3호 가용성 상
    evidence_field: infra_facts.in_asg

  - id: A-REDUN-02
    axis: availability
    level: 상
    basis_type: control_state
    when:
      asset_type: 데이터(DBMS)
      infra_facts.multi_az: false
    statement: 해당 자산이 사용 불가능할 때 대체(백업) 자산이 없어 장기적인 업무 중단이 발생하는 경우 (Multi-AZ 미구성)
    source: 정보자산관리지침 별지 제3호 가용성 상
    evidence_field: infra_facts.multi_az
